# ---------- docker-compose.dev.yaml ----------
version: "3.8"

services:
  frontend:
    container_name: nft-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: sh -c "npm run dev -- --host 0.0.0.0"
